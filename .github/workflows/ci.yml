name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: sublet_tracker_test
          POSTGRES_USER: sublet_tracker
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sublet_tracker -d sublet_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      DATABASE_URL: postgresql://sublet_tracker:ci-only-password@localhost:5432/sublet_tracker_test
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-only-secret-not-used-in-production
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost
      SECURE_SSL_REDIRECT: "1"
      ALLOW_PUBLIC_SIGNUP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install application and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]' && python -m pip install 'pip-audit>=2.9,<3'
      - name: Lint
        run: python -m ruff check .
      - name: Django checks and migration drift
        run: |
          python manage.py check --deploy
          python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python -m pytest -q
      - name: Dependency audit
        run: python -m pip_audit

  config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: shellcheck docker/*.sh
      - name: Validate OpenAPI and YAML
        run: |
          python -m pip install --disable-pip-version-check yamllint==1.35.1
          yamllint -d relaxed compose.yaml .github/workflows/ci.yml docs/openapi.yaml
      - name: Validate Compose interpolation
        run: |
          cp .env.example .env
          docker compose --env-file .env config --quiet
          rm -f .env
      - name: Build production image
        run: docker build --file Dockerfile --tag sublet-tracker-ci:check .
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            --env APP_DOMAIN=example.test \
            --volume "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.9.1-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
