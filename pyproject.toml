[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "september-sublet-tracker"
version = "0.1.0"
description = "A self-hosted collaborative research tracker for sublet searches."
requires-python = ">=3.10"
dependencies = [
  "Django>=5.2,<5.3",
  "argon2-cffi>=23.1,<26",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<24",
  "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
  "ruff>=0.11,<0.12",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["config*", "accounts*", "projects*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
